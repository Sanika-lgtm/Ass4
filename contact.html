<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Shopora | Contact</title>

    <link rel="stylesheet" href="css/style.css">

</head>


<body>


<header>

    <nav class="navbar">

        <div class="logo">
            🛍️ Shopora
        </div>

        <ul class="nav-links">

            <li>
                <a href="index.html">
                    Home
                </a>
            </li>

            <li>
                <a href="products.html">
                    Products
                </a>
            </li>

            <li>
                <a href="contact.html"
                   class="active">
                    Contact
                </a>
            </li>

        </ul>

    </nav>

</header>



<section class="contact-section">

    <div class="contact-info">

        <h1>Get In Touch</h1>

        <p>
            Have a question? We'd love to hear from you!
        </p>

        <div class="contact-item">
            📧
            <strong>Email</strong>
            <p>support@shopora.com</p>
        </div>

        <div class="contact-item">
            📞
            <strong>Phone</strong>
            <p>+91 98765 43210</p>
        </div>

        <div class="contact-item">
            📍
            <strong>Location</strong>
            <p>Mumbai, Maharashtra</p>
        </div>

    </div>


    <div class="contact-form">

        <h2>Send Us a Message</h2>

        <form onsubmit="return validateForm()">

            <input
                type="text"
                id="name"
                placeholder="Enter your name">

            <input
                type="email"
                id="email"
                placeholder="Enter your email">

            <input
                type="text"
                id="subject"
                placeholder="Subject">

            <textarea
                id="message"
                rows="5"
                placeholder="Write your message">
            </textarea>

            <button
                type="submit"
                class="btn">

                Send Message

            </button>

        </form>

    </div>

</section>



<footer>

    <h3>🛍️ Shopora</h3>

    <p>© 2026 Shopora. All Rights Reserved.</p>

</footer>


<script src="js/script.js"></script>

</body>

</html>
